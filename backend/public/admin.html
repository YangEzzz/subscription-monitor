<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>续订清单 · 临时管理后台</title>
    <style>
      :root {
        --green: #146747;
        --deep: #104e37;
        --text: #172a22;
        --muted: #65766d;
        --line: #dfe7e2;
        --bg: #f3f5f4;
        --surface: #fff;
        --tint: #e8f1ec;
        --danger: #b43d47;
        --amber: #966018;
        --font: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        --number: 'Bahnschrift', 'DIN Alternate', Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--muted) var(--bg);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--muted);
        border: 2px solid var(--bg);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--green);
      }
      ::-webkit-scrollbar-thumb:active {
        background: var(--deep);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 var(--font);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 8px;
        padding: 9px 16px;
        min-height: 42px;
      }
      button:hover {
        background: var(--tint);
        border-color: var(--green);
      }
      button:active {
        background: var(--line);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:disabled:hover {
        background: var(--surface);
        border-color: var(--line);
      }
      :focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 3px;
      }
      input,
      select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        padding: 10px 12px;
        min-height: 44px;
      }
      select {
        cursor: pointer;
      }
      header {
        background: var(--deep);
        color: var(--surface);
        padding: 26px max(24px, calc((100vw - 1240px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      h1 {
        font-size: 23px;
        margin: 0;
        letter-spacing: 0.04em;
        font-weight: 650;
      }
      header p {
        margin: 4px 0 0;
        opacity: 0.85;
        font-size: 12px;
      }
      .local {
        white-space: nowrap;
        border: 1px solid #ffffff66;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
      }
      main {
        max-width: 1288px;
        margin: auto;
        padding: 28px 24px 44px;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 18px;
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .intro p {
        margin: 4px 0 0;
      }
      #updated {
        font-size: 12px;
        min-height: 20px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .metric {
        padding: 20px 24px;
        border-right: 1px solid var(--line);
      }
      .metric:last-child {
        border: 0;
      }
      .metric strong {
        display: block;
        font: 32px/1.4 var(--number);
        margin-top: 5px;
      }
      .metric span {
        color: var(--muted);
      }
      .warning strong {
        color: var(--amber);
      }
      .service {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 0 0 22px;
        padding: 0;
        list-style: none;
        color: var(--muted);
        font-size: 12px;
      }
      .service b {
        color: var(--text);
        font-weight: 500;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      form {
        display: flex;
        gap: 8px;
        flex: 1;
        justify-content: flex-end;
        align-items: center;
      }
      .searchbox {
        position: relative;
        flex: 1;
        max-width: 340px;
      }
      .searchbox input {
        width: 100%;
        padding-right: 56px;
      }
      #clear {
        position: absolute;
        right: 5px;
        top: 5px;
        padding: 0 10px;
        min-height: 34px;
        font-size: 12px;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      .tablewrap {
        overflow: auto;
        min-height: 330px;
        scrollbar-gutter: stable;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
        white-space: nowrap;
      }
      th {
        background: var(--bg);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      td,
      th {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      td {
        font-size: 13px;
      }
      tbody tr:hover {
        background: var(--tint);
      }
      .id {
        font: 12px var(--number);
      }
      .badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 5px;
        background: var(--tint);
        color: var(--deep);
        font-size: 12px;
      }
      .badge.danger {
        background: var(--bg);
        color: var(--danger);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        height: 275px;
        white-space: normal;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 16px 20px;
      }
      .pager-controls {
        display: flex;
        gap: 8px;
      }
      .message {
        margin: 0 0 18px;
        min-height: 26px;
        color: var(--muted);
      }
      .message.error {
        color: var(--danger);
      }
      .roadmap {
        margin-top: 30px;
      }
      .roadmap p {
        margin: 6px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .roadmap h2 {
        font-size: 14px;
      }
      @media (max-width: 700px) {
        header {
          padding: 22px 16px;
        }
        h1 {
          font-size: 19px;
        }
        main {
          padding: 20px 16px;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
        }
        .metric {
          padding: 14px 18px;
          border-bottom: 1px solid var(--line);
        }
        .metric:nth-child(2) {
          border-right: 0;
        }
        .metric:nth-child(3) {
          border-bottom: 0;
        }
        .toolbar {
          padding: 16px;
        }
        .field,
        form {
          width: 100%;
        }
        form {
          flex-wrap: wrap;
        }
        .searchbox {
          max-width: none;
          min-width: 160px;
        }
        .local {
          padding: 4px 7px;
        }
        .pager {
          flex-wrap: wrap;
        }
      }
      @media (forced-colors: active) {
        * {
          scrollbar-color: auto;
        }
        button,
        input,
        select,
        .badge {
          border: 1px solid ButtonText;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>
          续订清单
          <span style="font-size: 14px; font-weight: 400">/ 管理后台</span>
        </h1>
        <p>查看账号、订阅与微信通知的运行情况</p>
      </div>
      <span class="local">仅本机访问</span>
    </header>
    <main>
      <section class="intro">
        <div>
          <h2>运行概览</h2>
          <p id="updated" class="muted">尚未读取数据</p>
        </div>
        <button id="refresh" type="button">刷新数据</button>
      </section>
      <section class="metrics" aria-label="数据概览">
        <div class="metric">
          <span>用户总数</span><strong id="users">—</strong>
        </div>
        <div class="metric">
          <span>未删除的订阅</span><strong id="subscriptions">—</strong>
        </div>
        <div class="metric">
          <span>通知记录</span><strong id="notifications">—</strong>
        </div>
        <div class="metric warning">
          <span>失败 / 待核实通知</span
          ><strong id="failedNotifications">—</strong>
        </div>
      </section>
      <ul class="service">
        <li>数据存储 <b id="persistence">—</b></li>
        <li>微信通知 <b id="configured">—</b></li>
        <li>定时任务 <b id="scheduler">—</b></li>
      </ul>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <section class="panel" aria-label="后台数据查询">
        <div class="toolbar">
          <div class="field">
            <label for="section">查看</label
            ><select id="section">
              <option value="subscriptions">订阅记录</option>
              <option value="users">用户列表</option>
              <option value="notifications">通知记录</option>
            </select>
          </div>
          <form id="searchform" novalidate>
            <div class="searchbox">
              <label for="search" class="muted" hidden>搜索记录</label
              ><input
                id="search"
                type="search"
                maxlength="128"
                aria-label="搜索记录"
                placeholder="订阅名称、用户 ID 或记录 ID"
              /><button id="clear" type="button" hidden aria-label="清除搜索">
                清除
              </button>
            </div>
            <button type="submit">查询</button>
          </form>
        </div>
        <div class="tablewrap" id="tablewrap" aria-busy="false">
          <table>
            <caption
              id="caption"
              style="
                text-align: left;
                padding: 12px 20px;
                color: var(--muted);
                font-size: 12px;
              "
            >
              订阅记录 · 按创建时间倒序
            </caption>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="range" class="muted">每页 20 条</span>
          <div class="pager-controls">
            <button type="button" id="prev" disabled>上一页</button
            ><button type="button" id="next" disabled>下一页</button>
          </div>
        </div>
      </section>
      <section class="roadmap">
        <h2>后续管理功能</h2>
        <p>
          订阅编辑与恢复 · 会员与额度管理 · 通知失败排查与重试 · 操作日志 ·
          管理员权限
        </p>
        <p>
          当前版本支持查询、搜索、分页和刷新。所有数据从后端读取，不使用本地演示数据。
        </p>
      </section>
    </main>
    <script>
      'use strict';
      const $ = (id) => document.getElementById(id);
      const schemas = {
        subscriptions: [
          ['name', '订阅名称'],
          ['userId', '用户 ID'],
          ['amount', '金额'],
          ['nextBillingDate', '下次扣费'],
          ['status', '状态'],
          ['deletedAt', '删除时间'],
          ['id', '记录 ID'],
        ],
        users: [
          ['id', '用户 ID'],
          ['subscriptions', '未删除订阅'],
          ['plan', '账号方案'],
          ['notificationEnabled', '通知开关'],
          ['createdAt', '注册时间'],
        ],
        notifications: [
          ['subscriptionName', '订阅名称'],
          ['userId', '用户 ID'],
          ['billingDate', '账期'],
          ['status', '发送状态'],
          ['attempts', '尝试次数'],
          ['errorCode', '错误码'],
          ['createdAt', '创建时间'],
        ],
      };
      const labels = {
        active: '正常',
        trial: '试用',
        pending: '待确认',
        paused: '暂停',
        cancelled: '已取消',
        archived: '归档',
        free: '免费',
        member: '会员',
        sent: '已发送',
        sending: '发送中',
        failed: '失败',
        unknown: '待核实',
        skipped: '已跳过',
      };
      let composing = false;
      let page = 1,
        total = 0,
        query = '',
        requestId = 0,
        controller,
        busy = false;
      const initial = new URLSearchParams(location.search);
      if (schemas[initial.get('section')])
        $('section').value = initial.get('section');
      query = (initial.get('search') || '').slice(0, 128);
      $('search').value = query;
      page = /^[1-9]\d{0,5}$/.test(initial.get('page') || '')
        ? Number(initial.get('page'))
        : 1;
      function message(text, error = false) {
        $('message').textContent = text;
        $('message').classList.toggle('error', error);
      }
      function paging() {
        $('prev').disabled = busy || page <= 1;
        $('next').disabled = busy || page * 20 >= total;
      }
      function setBusy(value) {
        busy = value;
        $('tablewrap').setAttribute('aria-busy', String(value));
        $('refresh').disabled = value;
        paging();
      }
      function format(key, value, row) {
        if (value === null || value === undefined || value === '') return '—';
        if (key === 'amount')
          return `${row.currency} ${Number(value).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        if (key === 'notificationEnabled') return value ? '已开启' : '已关闭';
        if (key === 'createdAt' || key === 'deletedAt')
          return new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          }).format(new Date(value));
        return labels[value] || String(value);
      }
      function render(items, section) {
        const fields = schemas[section];
        $('thead').replaceChildren();
        $('tbody').replaceChildren();
        const header = document.createElement('tr');
        fields.forEach(([, label]) => {
          const th = document.createElement('th');
          th.scope = 'col';
          th.textContent = label;
          header.append(th);
        });
        $('thead').append(header);
        if (!items.length) {
          const tr = document.createElement('tr'),
            td = document.createElement('td');
          td.colSpan = fields.length;
          td.className = 'empty';
          td.textContent = query
            ? '没有匹配的记录，请修改或清除搜索条件。'
            : '暂无记录。';
          tr.append(td);
          $('tbody').append(tr);
        }
        items.forEach((row) => {
          const tr = document.createElement('tr');
          fields.forEach(([key]) => {
            const td = document.createElement('td');
            td.textContent = format(key, row[key], row);
            if (key === 'id' || key === 'userId') td.className = 'id';
            if (key === 'status') {
              const badge = document.createElement('span');
              badge.className = ['failed', 'unknown'].includes(row[key])
                ? 'badge danger'
                : 'badge';
              badge.textContent = td.textContent;
              td.replaceChildren(badge);
            }
            tr.append(td);
          });
          $('tbody').append(tr);
        });
        $('caption').textContent =
          `${$('section').selectedOptions[0].textContent} · 按创建时间倒序`;
        $('range').textContent = total
          ? `共 ${total} 条 · 第 ${(page - 1) * 20 + 1}–${Math.min(page * 20, total)} 条`
          : '共 0 条 · 每页 20 条';
      }
      async function get(url, signal) {
        let response;
        try {
          response = await fetch(url, {
            signal: AbortSignal.any([signal, AbortSignal.timeout(20000)]),
            cache: 'no-store',
          });
        } catch (error) {
          if (signal.aborted) throw error;
          throw new Error(
            error.name === 'TimeoutError'
              ? '读取超时，请重试'
              : '无法连接本地后台，请确认后端已启动',
          );
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || '查询失败，请重试');
        return data;
      }
      async function load() {
        if (location.protocol === 'file:') {
          message(
            '请通过 http://127.0.0.1:3002 打开后台，直接打开文件无法读取数据。',
            true,
          );
          render([], $('section').value);
          return;
        }
        controller?.abort();
        controller = new AbortController();
        const id = ++requestId,
          section = $('section').value;
        setBusy(true);
        message('正在读取数据…');
        $('clear').hidden = !$('search').value;
        const params = new URLSearchParams({
          section,
          page: String(page),
          search: query,
        });
        history.replaceState(null, '', `?${params}`);
        const signal = controller.signal;
        const results = await Promise.allSettled([
          get('/data?' + params, signal),
          get('/overview', signal),
        ]);
        if (id !== requestId) return;
        const [list, overview] = results;
        let errors = [];
        if (list.status === 'fulfilled') {
          total = list.value.total;
          const max = Math.max(1, Math.ceil(total / 20));
          if (page > max) {
            page = max;
            return load();
          }
          render(list.value.items, section);
        } else {
          total = 0;
          render([], section);
          $('tbody').firstChild.firstChild.textContent =
            '数据读取失败，请点击「刷新数据」重试。';
          errors.push(list.reason.message);
        }
        if (overview.status === 'fulfilled') {
          const data = overview.value;
          [
            'users',
            'subscriptions',
            'notifications',
            'failedNotifications',
          ].forEach(
            (key) =>
              ($(key).textContent = Number(data[key]).toLocaleString('zh-CN')),
          );
          $('persistence').textContent =
            data.persistence === 'prisma' ? 'PostgreSQL' : '内存（开发环境）';
          $('configured').textContent = data.notificationsConfigured
            ? '已配置'
            : '未配置';
          $('scheduler').textContent = data.schedulerEnabled
            ? '已开启'
            : '已关闭';
        } else {
          [
            'users',
            'subscriptions',
            'notifications',
            'failedNotifications',
            'persistence',
            'configured',
            'scheduler',
          ].forEach((key) => ($(key).textContent = '—'));
          errors.push('概览读取失败');
        }
        $('updated').textContent = errors.length
          ? '本次读取未完成'
          : `更新于 ${new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date())}`;
        message(
          errors.length ? errors.join('；') : '已读取最新数据。',
          errors.length > 0,
        );
        setBusy(false);
      }
      $('section').addEventListener('change', () => {
        page = 1;
        query = '';
        $('search').value = '';
        $('search').placeholder =
          $('section').value === 'users'
            ? '用户 ID'
            : $('section').value === 'notifications'
              ? '订阅名称、用户 ID 或错误码'
              : '订阅名称、用户 ID 或记录 ID';
        void load();
      });
      $('searchform').addEventListener('submit', (event) => {
        event.preventDefault();
        if (composing) return;
        page = 1;
        query = $('search').value.trim();
        void load();
      });
      $('search').addEventListener('input', () => {
        $('clear').hidden = !$('search').value;
      });
      $('search').addEventListener('compositionstart', () => {
        composing = true;
      });
      $('search').addEventListener('compositionend', () => {
        composing = false;
      });
      $('search').addEventListener('search', () => {
        if (!$('search').value) {
          query = '';
          page = 1;
          void load();
        }
      });
      $('clear').addEventListener('click', () => {
        query = '';
        page = 1;
        $('search').value = '';
        $('search').focus();
        void load();
      });
      $('refresh').addEventListener('click', () => {
        void load();
      });
      $('prev').addEventListener('click', () => {
        if (!busy && page > 1) {
          page--;
          void load();
        }
      });
      $('next').addEventListener('click', () => {
        if (!busy && page * 20 < total) {
          page++;
          void load();
        }
      });
      void load();
    </script>
  </body>
</html>
