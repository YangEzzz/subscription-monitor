name: subscription-monitor

x-api-image: &api-image
  image: subscription-monitor-api:${IMAGE_TAG:-local}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-api-environment: &api-environment
  env_file:
    - ./deploy/.env.production
  networks:
    - backend

services:
  postgres:
    image: postgres:16-bookworm
    env_file:
      - ./deploy/.env.production
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: [*api-image, *api-environment]
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*api-image, *api-environment]
    environment:
      LOCAL_ADMIN_BIND_HOST: 0.0.0.0
    init: true
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
