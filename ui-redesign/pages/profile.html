<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<style>
  .profile{margin-top:16px;padding:16px 16px 0}
  .who{display:flex;align-items:center;gap:12px}
  .avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:21px;font-weight:700;flex-shrink:0;
    background:linear-gradient(150deg,#86A3FF,#3F68F2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px rgba(47,91,234,.7)}
  .who .n{font-size:17px;font-weight:700}
  .who .s{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
  .who .pill{margin-left:auto;align-self:flex-start}
  .kpis{display:flex;margin:14px -16px 0;border-top:1px solid var(--hair)}
  .kpi{flex:1;padding:12px 16px 14px}
  .kpi+.kpi{border-left:1px solid var(--hair)}
  .kpi .k{font-size:11.5px;color:var(--ink-3)}
  .kpi .v{margin-top:4px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
  .kpi .v.num{font-size:20px}

  .vip{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 14px;overflow:hidden;
    background:linear-gradient(110deg,rgba(241,239,255,.95),rgba(234,240,255,.9));border-color:var(--violet-line)}
  .vip::after{content:'';position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(150,130,255,.28),transparent 70%)}
  .vip .icon-tile{width:40px;height:40px;border-radius:13px;color:#fff;border:0;
    background:linear-gradient(150deg,#7C6CF0,#4B5BE6);box-shadow:0 6px 12px -6px rgba(91,75,219,.8)}
  .vip .e{font-size:10.5px;font-weight:600;color:var(--violet);letter-spacing:.06em}
  .vip .t{margin-top:2px;font-size:15.5px;font-weight:700}
  .vip .d{margin-top:2px;font-size:12px;color:var(--ink-3)}
  .vip .body{flex:1;position:relative;z-index:1}
  .vip .chev{color:var(--violet);position:relative;z-index:1}
</style>
</head>
<body class="canvas" data-tab="3">
<div class="device">
  <div class="page">
    <div class="page-head">
      <div>
        <div class="page-title">我的</div>
        <div class="page-sub">管理提醒、账号额度与数据偏好</div>
      </div>
      <div class="capsule"></div>
    </div>

    <section class="card hero profile">
      <div class="who">
        <div class="avatar">续</div>
        <div><div class="n">续订清单用户</div><div class="s">已保存 · 3 项订阅</div></div>
        <span class="pill green round"><span class="dot" style="background:var(--green)"></span>微信已登录</span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">月均支出</div><div class="v num">¥129.00</div></div>
        <div class="kpi"><div class="k">提醒状态</div><div class="v"><span class="dot" style="background:var(--green);box-shadow:0 0 0 3px rgba(31,163,91,.15)"></span>微信通知</div></div>
      </div>
    </section>

    <section class="card vip">
      <div class="icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l2.4 1.7 2.9-.1.9 2.8 2.3 1.8-.9 2.8.9 2.8-2.3 1.8-.9 2.8-2.9-.1L12 21.2l-2.4-1.7-2.9.1-.9-2.8-2.3-1.8.9-2.8-.9-2.8 2.3-1.8.9-2.8 2.9.1z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></svg></div>
      <div class="body"><div class="e">会员权益</div><div class="t">会员已开启</div><div class="d">无限新增订阅</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </section>

    <div class="group-cap">提醒设置</div>
    <section class="card list">
      <div class="setrow">
        <div class="icon-tile blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></div>
        <div class="body"><div class="t">续费通知</div><div class="d">已开启长期提醒 · 仅发送已填写金额的记录</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="setrow">
        <div class="icon-tile gray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3.6A6 6 0 0 1 18 8c0 3 .5 5 1.2 6.4M17 17H3s3-2 3-9c0-.5.1-1 .2-1.5"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0M3 3l18 18"/></svg></div>
        <div class="body"><div class="t">暂停微信通知</div><div class="d">暂停发送，保留已有授权</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="setrow">
        <div class="icon-tile violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg></div>
        <div class="body"><div class="t">通知发送记录</div><div class="d">查看最近的发送结果</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="setrow">
        <div class="icon-tile orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 3.5 2.5 6M19 3.5 21.5 6"/></svg></div>
        <div class="body"><div class="t">默认提醒规则</div><div class="d">提前 7、3、1 天 · 09:00</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </section>

    <div class="group-cap">数据与偏好</div>
    <section class="card list">
      <div class="setrow">
        <div class="icon-tile green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a1.5 1.5 0 0 1 1.5 1.5V8"/><rect x="3.5" y="7.5" width="17" height="12.5" rx="3"/><path d="M20.5 11.5h-4a2 2 0 0 0 0 4h4"/></svg></div>
        <div class="body"><div class="t">默认币种</div></div>
        <span class="val num" style="font-size:14px">CNY</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </section>
  </div>
</div>
<script src="../assets/shell.js"></script>
</body>
</html>
