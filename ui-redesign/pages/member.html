<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>会员中心</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<style>
  .club{margin:10px 16px 0;border-radius:24px;padding:18px 18px 0;position:relative;overflow:hidden;color:#fff;
    background:radial-gradient(120% 90% at 100% 0%,#6E7BFF 0%,transparent 55%),linear-gradient(150deg,#4B3FC9 0%,#4A55E0 55%,#3D6CF0 100%);
    box-shadow:0 18px 36px -18px rgba(70,70,220,.75),inset 0 1px 0 rgba(255,255,255,.25)}
  .club::before{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:20px 20px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 70%)}
  .club-top{display:flex;justify-content:space-between;align-items:center;position:relative}
  .club-top .brand{font-size:12.5px;font-weight:600;opacity:.92;letter-spacing:.02em}
  .glass-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;gap:5px}
  .club-body{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .club .hi{font-size:13px;color:#FFD88A;font-weight:500}
  .club .tier{margin-top:4px;font-size:30px;font-weight:800;letter-spacing:.02em}
  .club .desc{margin-top:8px;font-size:12.5px;line-height:1.6;opacity:.85;max-width:190px}
  .medal{width:96px;height:96px;position:relative;flex-shrink:0;margin-right:4px}
  .medal .ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
  .medal .tile{position:absolute;inset:8px;border-radius:24px;transform:rotate(-10deg);display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.45);
    box-shadow:0 14px 24px -10px rgba(20,20,90,.6),inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(6px)}
  .medal .tile svg{width:42px;height:42px;transform:rotate(10deg);filter:drop-shadow(0 3px 4px rgba(150,90,0,.35))}
  .spark{position:absolute;color:#FFE3A3}
  .club-foot{position:relative;display:flex;justify-content:space-between;margin:16px -18px 0;padding:12px 18px 14px;
    border-top:1px solid rgba(255,255,255,.18);font-size:12.5px}
  .club-foot b{font-weight:600}
  .club-foot span{opacity:.8}

  .benefits{overflow:hidden}
  .b-main{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(110deg,rgba(241,239,255,.9),rgba(255,255,255,0) 80%)}
  .b-main .t{font-size:15.5px;font-weight:700}
  .b-main .d{margin-top:3px;font-size:12px;color:var(--ink-3)}
  .b-main .inf{margin-left:auto;font-size:30px;font-weight:300;line-height:1;
    background:linear-gradient(150deg,#7C6CF0,#3F68F2);-webkit-background-clip:text;color:transparent}
  .b-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair)}
  .b-cell{padding:14px 16px 16px}
  .b-cell+.b-cell{border-left:1px solid var(--hair)}
  .b-cell .icon-tile{width:32px;height:32px;border-radius:10px}
  .b-cell .icon-tile svg{width:16px;height:16px}
  .b-cell .t{margin-top:10px;font-size:14px;font-weight:700}
  .b-cell .d{margin-top:4px;font-size:11.5px;color:var(--ink-3);line-height:1.45}
  .free{display:flex;justify-content:center;align-items:center;gap:6px;padding:14px 0 2px;font-size:12.5px;color:var(--ink-3)}
  .free i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);border:1px solid var(--green-line);color:var(--green)}
  .free i svg{width:10px;height:10px}

  .plan{margin-top:14px;padding:16px}
  .plan-head{display:flex;justify-content:space-between;align-items:center}
  .plan-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .plan-row .t{font-size:16px;font-weight:700}
  .plan-row .d{margin-top:4px;font-size:12px;color:var(--ink-3)}
  .price{font-family:var(--font-num);font-weight:700;color:var(--violet);display:flex;align-items:baseline;gap:1px}
  .price .c{font-size:18px}
  .price .i{font-size:36px;line-height:1;letter-spacing:-.02em}
  .owned{margin-top:16px;width:100%;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:14.5px;font-weight:600;color:var(--violet);background:var(--violet-soft);border:1px solid var(--violet-line)}
  .owned svg{width:16px;height:16px}
  .plan .note{margin-top:10px;text-align:center;font-size:11.5px;color:var(--ink-3)}
  .orders{margin-top:12px}
</style>
</head>
<body class="canvas no-dock">
<div class="device">
  <div class="page">
    <div class="navbar">
      <div class="icon-btn" aria-label="返回"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <div class="title">会员中心</div>
      <div class="capsule"></div>
    </div>

    <section class="club">
      <div class="club-top">
        <span class="brand">续订清单 · 会员俱乐部</span>
        <span class="glass-pill"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>权益已生效</span>
      </div>
      <div class="club-body">
        <div>
          <div class="hi">很高兴，有你同行</div>
          <div class="tier">永久会员</div>
          <div class="desc">不限订阅数量，陪你从容管理每一次续费。</div>
        </div>
        <div class="medal">
          <div class="ring"></div>
          <div class="tile"><svg viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A6"/><stop offset="1" stop-color="#F3B94A"/></linearGradient></defs>
            <path d="M8 17l9 7 7-12 7 12 9-7-3.5 19a3 3 0 0 1-3 2.5h-19a3 3 0 0 1-3-2.5z" fill="url(#g)"/><rect x="18" y="30" width="12" height="3" rx="1.5" fill="#C98A1B" opacity=".55"/></svg></div>
          <svg class="spark" style="right:-12px;top:-8px" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
          <svg class="spark" style="left:-10px;bottom:2px;opacity:.8" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
        </div>
      </div>
      <div class="club-foot"><span>有效期：<b>永久</b></span><b>无需续费</b></div>
    </section>

    <div class="sec-head">
      <div class="sec-title">把喜欢的，都安排好</div>
      <span class="pill violet round">永久会员权益</span>
    </div>
    <section class="card benefits">
      <div class="b-main">
        <div class="icon-tile violet" style="width:40px;height:40px;border-radius:13px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg></div>
        <div><div class="t">订阅数量，不设上限</div><div class="d">从日常影音到效率工具，想记多少就记多少</div></div>
        <span class="inf">∞</span>
      </div>
      <div class="b-grid">
        <div class="b-cell">
          <div class="icon-tile gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5v1.5A3 3 0 0 0 7.5 10.5M17 6h2.5v1.5a3 3 0 0 1-3 3M12 14v3M8.5 20.5h7M9.5 17h5"/></svg></div>
          <div class="t">一次开通，永久拥有</div><div class="d">无到期日，不会自动续费</div>
        </div>
        <div class="b-cell">
          <div class="icon-tile blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 12v8M9 15l3-3 3 3"/></svg></div>
          <div class="t">换台设备，权益还在</div><div class="d">会员权益跟随微信账号</div>
        </div>
      </div>
    </section>
    <div class="free"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>提醒、统计与导出，免费版也能用</div>

    <section class="card plan">
      <div class="plan-head"><div class="card-title">你的会员方案</div><span class="pill gold">永久有效</span></div>
      <div class="plan-row">
        <div><div class="t">永久会员</div><div class="d">一次性购买 · 无自动续费</div></div>
        <div class="price"><span class="c">¥</span><span class="i">9.90</span></div>
      </div>
      <div class="owned"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已开通 · 好好享受订阅自由</div>
      <div class="note">权益已绑定当前微信账号，无需重复购买。</div>
    </section>

    <section class="card list orders">
      <div class="setrow">
        <div class="icon-tile violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1.5 1.5 0 0 1 1.5 1.5v16l-3-2-2.5 2-2-2-2 2-2.5-2-3 2V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M9 9h6M9 13h4"/></svg></div>
        <div class="body"><div class="t">我的订单</div><div class="d">查看购买记录与支付状态</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </section>
  </div>
</div>
<script src="../assets/shell.js"></script>
</body>
</html>
