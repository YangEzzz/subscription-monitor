<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>统计</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/components.css">
<style>
  .hero{margin-top:12px;padding:16px 16px 14px}
  .hero-top{display:flex;justify-content:space-between;align-items:center}
  .eyebrow{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .cur-btn{height:30px;padding:0 9px 0 11px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;
    font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--blue);background:#fff;border:1px solid var(--blue-line)}
  .cur-btn svg{width:12px;height:12px}
  .big{margin-top:8px;display:flex;align-items:baseline;gap:2px}
  .big .c{font-family:var(--font-num);font-weight:700;font-size:24px;color:var(--ink-2)}
  .big .i{font-family:var(--font-num);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.02em}
  .big .d{font-family:var(--font-num);font-weight:700;font-size:24px;color:var(--ink-3)}
  .basis{margin-top:8px;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3)}
  .basis svg{width:13px;height:13px}
  .hero .segmented{margin-top:14px}

  .sec-card{margin-top:14px;padding-bottom:16px}
  .donut-wrap{display:flex;align-items:center;gap:18px;padding:16px 16px 0}
  .donut{position:relative;width:124px;height:124px;flex-shrink:0}
  .donut svg{width:124px;height:124px;transform:rotate(-90deg)}
  .donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .center b{font-size:15px;font-weight:700}
  .donut .center span{font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .legend{flex:1;display:flex;flex-direction:column;gap:14px}
  .lg .top{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500}
  .lg .top .dot{width:8px;height:8px;border-radius:3px}
  .lg .top .pct{margin-left:auto;font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--ink-2)}
  .lg .amt{margin:4px 0 0 15px;font-family:var(--font-num);font-weight:700;font-size:16px}
  .lg .track{margin:7px 0 0 15px;height:4px;border-radius:2px;background:var(--surface-sunken);overflow:hidden}
  .lg .track i{display:block;height:100%;border-radius:2px}

  .bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:128px;padding:0 16px;margin-top:14px;position:relative}
  .bars::after{content:'';position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--border)}
  .bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar .v{font-family:var(--font-num);font-weight:700;font-size:11.5px;color:var(--ink-2)}
  .bar i{display:block;width:100%;height:92px;border-radius:9px 9px 3px 3px;
    background:linear-gradient(180deg,#7E9DFF,#3F68F2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
</style>
</head>
<body class="canvas no-dock">
<div class="device">
  <div class="page">
    <div class="navbar">
      <div class="icon-btn" aria-label="返回"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <div class="title">统计</div>
      <div class="capsule"></div>
    </div>

    <section class="card hero">
      <div class="hero-top">
        <div class="eyebrow">月均订阅支出（估算）</div>
        <div class="cur-btn">CNY <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div class="big"><span class="c">¥</span><span class="i">129</span><span class="d">.00</span></div>
      <div class="basis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>基于 2 项 CNY 有效订阅 · 不自动换汇</div>
      <div class="segmented">
        <div class="seg on">月均</div><div class="seg">年度</div><div class="seg">未来30天</div>
        <span class="thumb"></span>
      </div>
    </section>

    <section class="card sec-card">
      <div class="card-head"><div class="card-title">分类构成</div><span class="pill gray">月均</span></div>
      <div class="donut-wrap">
        <div class="donut">
          <svg viewBox="0 0 124 124">
            <circle cx="62" cy="62" r="50" fill="none" stroke="rgba(21,22,28,.05)" stroke-width="14"/>
            <circle cx="62" cy="62" r="50" fill="none" stroke="var(--cat-video)" stroke-width="14" stroke-linecap="round" stroke-dasharray="254.9 314.16" stroke-dashoffset="-3"/>
            <circle cx="62" cy="62" r="50" fill="none" stroke="var(--cat-cloud)" stroke-width="14" stroke-linecap="round" stroke-dasharray="45.2 314.16" stroke-dashoffset="-265.9"/>
          </svg>
          <div class="center"><b>月均</b><span>分类占比</span></div>
        </div>
        <div class="legend">
          <div class="lg">
            <div class="top"><span class="dot" style="background:var(--cat-video)"></span>影音娱乐<span class="pct">83.7%</span></div>
            <div class="amt">¥108.00</div>
            <div class="track"><i style="width:83.7%;background:var(--cat-video)"></i></div>
          </div>
          <div class="lg">
            <div class="top"><span class="dot" style="background:var(--cat-cloud)"></span>云存储<span class="pct">16.3%</span></div>
            <div class="amt">¥21.00</div>
            <div class="track"><i style="width:16.3%;background:var(--cat-cloud)"></i></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card sec-card">
      <div class="card-head" style="align-items:flex-start">
        <div><div class="card-title">未来支出估算</div><div class="card-sub">按当前月均估算（6个月）</div></div>
        <span class="pill gray">币种：CNY</span>
      </div>
      <div class="bars">
        <div class="bar"><span class="v">129</span><i></i></div>
        <div class="bar"><span class="v">129</span><i></i></div>
        <div class="bar"><span class="v">129</span><i></i></div>
        <div class="bar"><span class="v">129</span><i></i></div>
        <div class="bar"><span class="v">129</span><i></i></div>
        <div class="bar"><span class="v">129</span><i></i></div>
      </div>
    </section>
  </div>
</div>
<script src="../assets/shell.js"></script>
</body>
</html>
